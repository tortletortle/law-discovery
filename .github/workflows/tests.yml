name: Formula Alchemist tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test symbolic dynamics discovery
        run: node test-dynamics.mjs
      - name: Test time-series derivative pipeline
        run: node test-derivatives.mjs
